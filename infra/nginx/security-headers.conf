# sia.haus — 오리진(Nginx)에서 보안 헤더를 붙이는 방식
#
# CloudFront 콘솔에 접근할 수 없거나, 오리진에서 관리하고 싶을 때 사용합니다.
# server 블록 안에 include 하세요:
#
#   server {
#       server_name sia.haus www.sia.haus;
#       include /etc/nginx/snippets/security-headers.conf;
#       ...
#   }
#
# 주의: CloudFront 응답 헤더 정책을 함께 쓰면 정책이 이 값을 덮어씁니다
#       (Override: true). 둘 중 한 곳에서만 관리하세요.

# MIME 스니핑 차단
add_header X-Content-Type-Options "nosniff" always;

# 클릭재킹 방지 — 외부 사이트의 iframe 삽입 차단
add_header X-Frame-Options "SAMEORIGIN" always;

# 레퍼러 최소화 — 외부 도메인으로는 출처만 전달
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 사용하지 않는 브라우저 기능 차단
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# HSTS — HTTPS 리다이렉트가 확실히 동작한 뒤에만 켤 것.
# 1단계: max-age=300 (5분)  → 문제 없으면
# 2단계: max-age=86400 (1일) → 문제 없으면
# 3단계: max-age=31536000; includeSubDomains (1년)
add_header Strict-Transport-Security "max-age=300" always;

# 서버 버전 노출 제거
server_tokens off;

# ── CSP는 별도 ────────────────────────────────────────────────
# 사이트가 91개 스크립트 소스를 참조하고 있어 CSP를 바로 강제하면
# 페이지가 깨집니다. 반드시 Report-Only로 먼저 관찰하세요.
#
# add_header Content-Security-Policy-Report-Only
#     "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; \
#      style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; \
#      font-src 'self' data: https:; frame-ancestors 'self'" always;
