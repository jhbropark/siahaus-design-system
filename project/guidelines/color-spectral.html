<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--ink-850);padding:24px;display:flex;gap:14px}
  .sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line-faint)}
  .chip{height:60px}
  .meta{padding:7px 10px;background:var(--ink-700)}
  .n{font-family:var(--font-mono);font-size:10px;letter-spacing:.03em;color:var(--text-muted)}
</style></head><body>
  <div class="sw"><div class="chip" style="background:var(--spectral-amber)"></div><div class="meta"><div class="n">amber</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--spectral-slate)"></div><div class="meta"><div class="n">slate</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--spectral-violet)"></div><div class="meta"><div class="n">violet</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--spectral-sage)"></div><div class="meta"><div class="n">sage</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--spectral-rose)"></div><div class="meta"><div class="n">rose</div></div></div>
</body></html>
