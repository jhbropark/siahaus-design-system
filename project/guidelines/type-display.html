<!-- @dsCard group="Type" viewport="700x300" name="Display — Pretendard" subtitle="Hero & display set thin and tight at scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--ink-850);padding:28px 32px;color:var(--text-strong);font-family:var(--font-display)}
  .row{display:flex;align-items:baseline;gap:16px;border-bottom:1px solid var(--line-faint);padding:10px 0}
  .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;color:var(--text-subtle);width:118px;flex:none}
  .hero{font-size:84px;font-weight:100;letter-spacing:-.03em;line-height:.96}
  .disp{font-size:60px;font-weight:200;letter-spacing:-.03em;line-height:1}
  .title{font-size:40px;font-weight:600;letter-spacing:-.02em}
  .head{font-size:28px;font-weight:500;letter-spacing:-.015em}
</style></head><body>
  <div class="row"><span class="tag">hero · 100</span><span class="hero">감각</span></div>
  <div class="row"><span class="tag">display · 200</span><span class="disp">Sensation</span></div>
  <div class="row"><span class="tag">title · 600</span><span class="title">Market Opportunity</span></div>
  <div class="row" style="border:0"><span class="tag">head · 500</span><span class="head">Executive Summary</span></div>
</body></html>
