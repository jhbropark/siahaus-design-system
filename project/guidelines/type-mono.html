<!-- @dsCard group="Type" viewport="700x230" name="Mono — IBM Plex Mono" subtitle="Eyebrows, data labels, indices — uppercase, tracked wide" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--ink-850);padding:28px 32px;font-family:var(--font-mono)}
  .stack{display:flex;flex-direction:column;gap:20px}
  .eyebrow{font-size:12px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
  .label{font-size:13px;font-weight:500;letter-spacing:.08em;color:var(--text-muted)}
  .data{font-size:40px;font-weight:600;letter-spacing:-.01em;color:var(--text-strong)}
  .idx{font-size:13px;letter-spacing:.1em;color:var(--text-subtle)}
</style></head><body>
  <div class="stack">
    <div class="eyebrow">// Case Study — 2026</div>
    <div class="data">₩819M <span style="font-size:15px;color:var(--text-subtle);letter-spacing:.08em">／ 21M × 39M</span></div>
    <div class="label">CLIENT: KIA &nbsp;·&nbsp; AGENCY: SONOLEE</div>
    <div class="idx">01 / 08 — base on Seoul</div>
  </div>
</body></html>
