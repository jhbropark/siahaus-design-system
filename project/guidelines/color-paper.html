<!-- @dsCard group="Colors" viewport="700x170" name="Paper — foreground" subtitle="Warm whites for type on dark, four levels of emphasis" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--ink-850);padding:24px;display:flex;gap:14px;flex-wrap:wrap}
  .sw{flex:1;min-width:110px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line-faint)}
  .chip{height:74px}
  .meta{padding:8px 10px;background:var(--ink-700)}
  .n{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;color:var(--text-muted)}
  .h{font-family:var(--font-mono);font-size:10px;color:var(--text-subtle);margin-top:2px}
</style></head><body>
  <div class="sw"><div class="chip" style="background:var(--paper-000)"></div><div class="meta"><div class="n">paper-000</div><div class="h">#FAFAF7 · hero</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--paper-100)"></div><div class="meta"><div class="n">paper-100</div><div class="h">#F2F2EE · text</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--paper-200)"></div><div class="meta"><div class="n">paper-200</div><div class="h">#D8D8D2 · muted</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--paper-300)"></div><div class="meta"><div class="n">paper-300</div><div class="h">#A7A8A3 · subtle</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--paper-400)"></div><div class="meta"><div class="n">paper-400</div><div class="h">#6E7075 · faint</div></div></div>
</body></html>
