<!-- @dsCard group="Colors" viewport="700x150" name="Signal — semantic" subtitle="Positive / warning / critical, tuned to sit quietly on ink" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--ink-850);padding:24px;display:flex;gap:14px}
  .sw{flex:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line-faint);display:flex;flex-direction:column}
  .chip{height:56px}
  .meta{padding:8px 12px;background:var(--ink-700)}
  .n{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;color:var(--text-muted)}
  .h{font-family:var(--font-mono);font-size:10px;color:var(--text-subtle);margin-top:2px}
</style></head><body>
  <div class="sw"><div class="chip" style="background:var(--signal-positive)"></div><div class="meta"><div class="n">positive</div><div class="h">#7FA88E</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--signal-warning)"></div><div class="meta"><div class="n">warning</div><div class="h">#D6A75C</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--signal-critical)"></div><div class="meta"><div class="n">critical</div><div class="h">#C58F8A</div></div></div>
</body></html>
