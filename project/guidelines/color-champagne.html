<!-- @dsCard group="Colors" viewport="700x190" name="Champagne — brand accent" subtitle="The single chromatic accent, drawn from architectural light" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--ink-850);padding:24px;display:flex;gap:18px;align-items:stretch}
  .big{flex:1.4;border-radius:var(--r-md);background:var(--champagne-400);display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
  .big .lab{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-900)}
  .big .hex{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--ink-900);margin-top:4px}
  .col{flex:1;display:flex;flex-direction:column;gap:10px}
  .row{flex:1;border-radius:var(--r-sm);display:flex;align-items:center;padding:0 12px;font-family:var(--font-mono);font-size:11px;letter-spacing:.04em}
</style></head><body>
  <div class="big"><div class="lab">Accent · Champagne</div><div class="hex">#C9A86A</div></div>
  <div class="col">
    <div class="row" style="background:var(--champagne-300);color:var(--ink-900)">champagne-300 · #E2CFA0</div>
    <div class="row" style="background:var(--champagne-500);color:var(--ink-900)">champagne-500 · #B08F4E</div>
    <div class="row" style="background:var(--champagne-600);color:var(--paper-100)">champagne-600 · #8A6F3A</div>
  </div>
</body></html>
