<!-- @dsCard group="Brand" viewport="700x230" name="Wordmark" subtitle="sia.haus — thin geometric lockup. White on ink is the primary." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--ink-850);padding:0;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-faint)}
  .cell{display:flex;align-items:center;justify-content:center;padding:30px;position:relative}
  .dark{background:var(--ink-900)}
  .light{background:var(--paper-000)}
  .acc{background:var(--ink-850)}
  img{width:200px;height:auto;display:block}
  .tag{position:absolute;left:14px;bottom:10px;font-family:var(--font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-subtle)}
  .light .tag{color:#9a9a93}
</style></head><body>
  <div class="cell dark"><img src="../assets/wordmark-white.png" alt="sia.haus"><span class="tag">white / ink — primary</span></div>
  <div class="cell light"><img src="../assets/wordmark-black.png" alt="sia.haus"><span class="tag">black / paper</span></div>
  <div class="cell acc" style="grid-column:1 / -1"><img src="../assets/wordmark-champagne.png" alt="sia.haus" style="width:170px"><span class="tag">champagne — accent contexts only</span></div>
</body></html>
