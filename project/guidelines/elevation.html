<!-- @dsCard group="Spacing" viewport="700x200" name="Elevation & glow" subtitle="Soft deep shadows for floating UI; champagne glow for emphasis" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--ink-850);padding:34px 32px;display:flex;gap:26px;align-items:center;font-family:var(--font-mono)}
  .u{display:flex;flex-direction:column;align-items:center;gap:14px}
  .box{width:96px;height:64px;background:var(--ink-700);border:1px solid var(--line-faint);border-radius:var(--r-md)}
  .n{font-size:10px;color:var(--text-subtle)}
</style></head><body>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="n">sm</div></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="n">md</div></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="n">lg</div></div>
  <div class="u"><div class="box" style="box-shadow:var(--shadow-xl)"></div><div class="n">xl</div></div>
  <div class="u"><div class="box" style="box-shadow:var(--glow-accent)"></div><div class="n">glow</div></div>
</body></html>
