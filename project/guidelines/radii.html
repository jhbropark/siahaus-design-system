<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="Restrained, near-square. Premium = sharp." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--ink-850);padding:28px 32px;display:flex;gap:22px;align-items:flex-end;font-family:var(--font-mono)}
  .u{display:flex;flex-direction:column;align-items:center;gap:10px}
  .box{width:84px;height:60px;background:var(--ink-600);border:1px solid var(--line)}
  .n{font-size:10px;color:var(--text-subtle)}
</style></head><body>
  <div class="u"><div class="box" style="border-radius:var(--r-none)"></div><div class="n">none · 0</div></div>
  <div class="u"><div class="box" style="border-radius:var(--r-xs)"></div><div class="n">xs · 2</div></div>
  <div class="u"><div class="box" style="border-radius:var(--r-sm)"></div><div class="n">sm · 4</div></div>
  <div class="u"><div class="box" style="border-radius:var(--r-md)"></div><div class="n">md · 8</div></div>
  <div class="u"><div class="box" style="border-radius:var(--r-lg)"></div><div class="n">lg · 14</div></div>
  <div class="u"><div class="box" style="border-radius:var(--r-pill);width:60px"></div><div class="n">pill</div></div>
</body></html>
